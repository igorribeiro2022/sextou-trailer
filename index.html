<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sextou · trailer</title>
<!--
  Toca o trailer (YouTube) para o app Sextou da TV Samsung.
  O app é um arquivo local na TV e o YouTube recusa tocar sem um site de origem (erro 153);
  aqui o vídeo toca a partir deste site e o app é avisado por postMessage:
  { sextou: 'trailer', state: 'playing' | 'ended' | 'error' | 'ad' }.
  Anúncio nunca aparece nem se ouve: o vídeo começa sem som e só avisa 'playing' (e liga o som)
  quando o trailer pedido está andando de verdade; anúncio no lugar dele → avisa 'ad' (o app
  continua com a imagem) e segue sem som até o trailer começar.
  O app troca de vídeo sem recarregar a página (o player do YouTube fica carregado, bem mais rápido):
  { sextou: 'cmd', cmd: 'load', v: '<id>', cc: 0|1 }, { sextou: 'cmd', cmd: 'play' } e { sextou: 'cmd', cmd: 'stop' }.
  Uso: index.html?v=<id do vídeo no YouTube>&cc=1 (legenda em português quando o trailer não é dublado)
       &play=0 deixa o player pronto sem tocar (pré-carregamento)
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var id = (q.get('v') || '').replace(/[^\w-]/g, '');
    var cc = q.get('cc') === '1' ? 1 : 0;
    var autoplay = q.get('play') !== '0';     // play=0: só deixa o player carregado (o app manda 'load' depois)
    function tell(state) { try { parent.postMessage({ sextou: 'trailer', state: state }, '*'); } catch (e) {} }
    if (!id) { tell('error'); return; }
    var player = null, ready = false, pending = null;
    var want = id;                                  // vídeo pedido (o resto é anúncio)
    var poll = 0, shown = false, lastT = -1, still = 0, adSent = false;
    function watch() {                              // começou a carregar um vídeo: vigia até o trailer andar
      clearInterval(poll);
      shown = false; lastT = -1; still = 0; adSent = false;
      poll = setInterval(check, 250);
    }
    function check() {
      if (!player || !player.getPlayerState) return;
      if (player.getPlayerState() !== 1) { lastT = -1; still = 0; return; }
      var d = null, t = 0;
      try { d = player.getVideoData && player.getVideoData(); } catch (e) {}
      try { t = player.getCurrentTime() || 0; } catch (e) {}
      var other = !!(d && d.video_id && d.video_id !== want);
      var moving = lastT >= 0 && t > lastT + 0.05;
      lastT = t;
      if (!other && moving) {                       // o trailer pedido andando: liga o som e avisa
        clearInterval(poll); poll = 0;
        shown = true;
        player.unMute(); player.setVolume(100);
        tell('playing');
        return;
      }
      if (other || ++still >= 4) {                  // tocando outra coisa (ou parado em "tocando"): anúncio
        player.mute();
        if (!adSent) { adSent = true; tell('ad'); }
      }
    }
    function run(m) {
      if (!player || !ready) { pending = m; return; }
      if (m.cmd === 'load' && m.v) {
        try { if (m.cc) player.loadModule('captions'); else player.unloadModule('captions'); } catch (e) {}
        want = String(m.v).replace(/[^\w-]/g, '');
        player.mute();
        player.loadVideoById(want);
        watch();
      } else if (m.cmd === 'play') {
        try { if (m.cc) player.loadModule('captions'); else player.unloadModule('captions'); } catch (e) {}
        player.mute(); player.playVideo();
        watch();
      } else if (m.cmd === 'stop') {
        clearInterval(poll); poll = 0;
        player.stopVideo();
      }
    }
    window.addEventListener('message', function (e) {
      var m = e.data;
      if (m && m.sextou === 'cmd') run(m);
    });
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        videoId: id,
        playerVars: { autoplay: autoplay ? 1 : 0, mute: 1, controls: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1, fs: 0, playsinline: 1,
          hl: 'pt-BR', cc_lang_pref: cc ? 'pt' : undefined, cc_load_policy: cc },
        events: {
          onReady: function (e) {
            ready = true;
            e.target.mute();
            if (autoplay) { e.target.playVideo(); watch(); }
            if (pending) { var m = pending; pending = null; run(m); }
          },
          onStateChange: function (e) {
            if (e.data === 1 && !shown && !poll) watch();
            else if (e.data === 0 && shown) tell('ended');   // fim do trailer (não do anúncio)
          },
          onError: function () { tell('error'); }
        }
      });
    };
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function () { tell('error'); };
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
